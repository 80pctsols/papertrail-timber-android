[versions]
agp = "9.4.1"
kotlin = "2.4.20"

minSdk = "19"
targetSdk = "29"
compileSdk = "36"

junit = "4.12"
appcompat = "1.1.0"
timber = "4.7.1"
slf4j = "1.7.29"
logbackAndroid = "1.1.1-6"
logbackSyslog4j = "1.0.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-android-core = { module = "com.github.tony19:logback-android-core", version.ref = "logbackAndroid" }
logback-android-classic = { module = "com.github.tony19:logback-android-classic", version.ref = "logbackAndroid" }
logback-syslog4j = { module = "com.papertrailapp:logback-syslog4j", version.ref = "logbackSyslog4j" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
